<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dragon Quest IX - Alchemy Recipes</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=Merriweather:wght@300;400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1>DRAGON QUEST IX</h1>
            <p class="subtitle">~ Complete Alchemy Recipe Guide ~</p>
        </header>

        <div class="controls">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search recipes by name...">
                <input type="text" id="ingredientSearch" placeholder="Search by ingredient...">
                <select id="categoryFilter">
                    <option value="">All Categories</option>
                    <option value="Swords">⚔️ Swords</option>
                    <option value="Spears">🔱 Spears</option>
                    <option value="Knives">🗡️ Knives</option>
                    <option value="Wands">🪄 Wands</option>
                    <option value="Whips">🪢 Whips</option>
                    <option value="Staves">🏑 Staves</option>
                    <option value="Claws">🦅 Claws</option>
                    <option value="Fans">🪭 Fans</option>
                    <option value="Axes">🪓 Axes</option>
                    <option value="Hammers">🔨 Hammers</option>
                    <option value="Boomerangs">🪃 Boomerangs</option>
                    <option value="Bows">🏹 Bows</option>
                    <option value="Shields">🛡️ Shields</option>
                    <option value="Head">👑 Head</option>
                    <option value="Torso">👕 Torso</option>
                    <option value="Arms">🧤 Arms</option>
                    <option value="Legs">👖 Legs</option>
                    <option value="Feet">👞 Feet</option>
                    <option value="Accessories">💍 Accessories</option>
                    <option value="Items">🎒 Items</option>
                </select>
                <select id="sortBy">
                    <option value="number">Sort by Number</option>
                    <option value="name">Sort by Name</option>
                    <option value="category">Sort by Category</option>
                    <option value="ingredients">Sort by Ingredient Count</option>
                </select>
            </div>
            <div class="stats" id="recipeStats"></div>
        </div>

        <div class="recipe-grid" id="recipeGrid"></div>
        <div class="no-results" id="noResults" style="display: none;">
            No recipes found! Try a different search.
        </div>
    </div>

    <script>
        let recipes = [];

        function getCategoryIcon(category) {
            const icons = {
                'Swords': '⚔️',
                'Spears': '🔱',
                'Knives': '🗡️',
                'Wands': '🪄',
                'Whips': '🪢',
                'Staves': '🏑',
                'Claws': '🦅',
                'Fans': '🪭',
                'Axes': '🪓',
                'Hammers': '🔨',
                'Boomerangs': '🪃',
                'Bows': '🏹',
                'Shields': '🛡️',
                'Head': '👑',
                'Torso': '👕',
                'Arms': '🧤',
                'Legs': '👖',
                'Feet': '👞',
                'Accessories': '💍',
                'Items': '🎒'
            };
            return icons[category] || '📦';
        }

        // Load recipes from JSON file
        async function loadRecipes() {
            try {
                console.log('Attempting to load recetas_alquimia.json...');
                // Add cache busting parameter
                const response = await fetch('recetas_alquimia.json?v=' + Date.now());
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                recipes = await response.json();
                console.log(`Loaded ${recipes.length} recipes successfully`);
                console.log('First recipe:', recipes[0]);
                
                if (!recipes || recipes.length === 0) {
                    throw new Error('No recipes found in JSON file');
                }
                
                displayRecipes(recipes);
            } catch (error) {
                console.error('Error loading recipes:', error);
                const errorMsg = error.message.includes('fetch') 
                    ? 'Cannot load recetas_alquimia.json. Make sure both files (recetas.html and recetas_alquimia.json) are in the same folder and you\'re opening the page through a web server (not file://).'
                    : `Error: ${error.message}`;
                    
                document.getElementById('recipeGrid').innerHTML =
                    `<div class="no-results">
                        <p>${errorMsg}</p>
                        <p style="margin-top: 20px; font-size: 0.9em;">
                            💡 If you're opening this from your computer, try:<br>
                            • Using a local web server (python3 -m http.server)<br>
                            • Or use Live Server extension in VS Code<br>
                            • Both files must be in the same folder
                        </p>
                    </div>`;
            }
        }

        function displayRecipes(recipesToDisplay) {
            const container = document.getElementById('recipeGrid');
            const noResults = document.getElementById('noResults');

            if (!recipesToDisplay || recipesToDisplay.length === 0) {
                container.style.display = 'none';
                noResults.style.display = 'block';
                return;
            }

            container.style.display = 'grid';
            noResults.style.display = 'none';

            container.innerHTML = recipesToDisplay.map(recipe => {
                // Validar que la receta tenga todas las propiedades necesarias
                if (!recipe.id || !recipe.result || !recipe.ingredients) {
                    console.warn('Invalid recipe:', recipe);
                    return '';
                }
                
                return `
                <div class="recipe-card">
                    <div class="recipe-header">
                        <span class="recipe-number">#${recipe.id || 'N/A'}</span>
                        <span class="ingredient-count">${recipe.ingredients ? recipe.ingredients.length : 0} items</span>
                    </div>
                    <div class="recipe-category">${getCategoryIcon(recipe.category || 'Unknown')} ${recipe.category || 'Unknown'}</div>
                    <h3 class="recipe-title">${recipe.result || 'Unknown Item'}</h3>
                    
                    <div class="recipe-details">
                        <div class="recipe-section">
                            <strong>Ingredients:</strong>
                            <div class="ingredients-list">
                                ${recipe.ingredients ? recipe.ingredients.map(ing => `
                                    <div class="ingredient-item">
                                        <span class="ingredient-name">${ing.name || 'Unknown'}</span>
                                        <span class="ingredient-quantity">×${ing.quantity || 0}</span>
                                    </div>
                                `).join('') : '<p>No ingredients found</p>'}
                            </div>
                        </div>
                    </div>
                </div>
                `;
            }).filter(Boolean).join('');

            // Update stats
            updateStats(recipesToDisplay.length, recipes.length);
        }

        function updateStats(shown, total) {
            const statsEl = document.getElementById('recipeStats');
            if (statsEl) {
                statsEl.textContent = `Showing ${shown} of ${total} recipes`;
            }
        }

        function filterRecipes() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const ingredientTerm = document.getElementById('ingredientSearch').value.toLowerCase();
            const categoryFilter = document.getElementById('categoryFilter').value;
            const sortBy = document.getElementById('sortBy').value;

            let filtered = recipes.filter(recipe => {
                const matchesSearch = !searchTerm ||
                    recipe.result.toLowerCase().includes(searchTerm);

                const matchesIngredient = !ingredientTerm ||
                    recipe.ingredients.some(ing => 
                        ing.name.toLowerCase().includes(ingredientTerm)
                    );

                const matchesCategory = !categoryFilter || recipe.category === categoryFilter;

                return matchesSearch && matchesIngredient && matchesCategory;
            });

            // Sort the filtered results
            filtered.sort((a, b) => {
                switch (sortBy) {
                    case 'number':
                        return a.id - b.id;
                    case 'name':
                        return a.result.localeCompare(b.result);
                    case 'category':
                        return a.category.localeCompare(b.category) || a.id - b.id;
                    case 'ingredients':
                        return a.ingredients.length - b.ingredients.length;
                    default:
                        return a.id - b.id;
                }
            });

            displayRecipes(filtered);
        }

        function resetFilters() {
            document.getElementById('searchInput').value = '';
            document.getElementById('ingredientSearch').value = '';
            document.getElementById('categoryFilter').value = '';
            document.getElementById('sortBy').value = 'number';
            displayRecipes(recipes);
        }

        // Event listeners
        document.getElementById('searchInput').addEventListener('input', filterRecipes);
        document.getElementById('ingredientSearch').addEventListener('input', filterRecipes);
        document.getElementById('categoryFilter').addEventListener('change', filterRecipes);
        document.getElementById('sortBy').addEventListener('change', filterRecipes);

        // Initialize the page
        window.addEventListener('load', loadRecipes);
    </script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #fff;
            font-family: 'Merriweather', serif;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            padding: 40px 20px;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            border-radius: 12px;
            margin-bottom: 30px;
            border: 3px solid #007acc;
            box-shadow: 0 8px 32px rgba(0,122,204,0.4);
        }

        h1 {
            font-family: 'Press Start 2P', monospace;
            font-size: 2.5em;
            color: #fff;
            text-shadow: 3px 3px 0 #007acc, 6px 6px 0 #005c99;
            margin-bottom: 15px;
            animation: glow 2s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from {
                text-shadow: 3px 3px 0 #007acc, 6px 6px 0 #005c99, 0 0 20px rgba(0,122,204,0.5);
            }
            to {
                text-shadow: 3px 3px 0 #007acc, 6px 6px 0 #005c99, 0 0 40px rgba(0,122,204,0.8);
            }
        }

        .subtitle {
            font-family: 'VT323', monospace;
            font-size: 1.5em;
            color: #b8b8d1;
            letter-spacing: 2px;
        }

        .controls {
            background: linear-gradient(135deg, #2a2a3a, #1a1a2a);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 30px;
            border: 2px solid #444;
        }

        .search-box {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            margin-bottom: 15px;
        }

        .search-box input,
        .search-box select {
            padding: 12px;
            border-radius: 8px;
            border: 2px solid #444;
            background: #2a2a3a;
            color: #fff;
            font-size: 14px;
            min-width: 200px;
            font-family: 'VT323', monospace;
            transition: all 0.3s ease;
        }

        .search-box input:focus,
        .search-box select:focus {
            outline: none;
            border-color: #007acc;
            box-shadow: 0 0 10px rgba(0,122,204,0.3);
        }

        .search-box input::placeholder {
            color: #888;
        }

        .stats {
            text-align: center;
            color: #b8b8d1;
            font-family: 'VT323', monospace;
            font-size: 1.2em;
            padding-top: 10px;
        }

        .recipe-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
            gap: 20px;
            padding: 20px;
        }

        .recipe-card {
            background: linear-gradient(145deg, #2a2a3a, #1a1a2a);
            border-radius: 12px;
            padding: 20px;
            border: 2px solid #444;
            transition: all 0.3s ease;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }

        .recipe-card:hover {
            transform: translateY(-3px);
            border-color: #007acc;
            box-shadow: 0 6px 20px rgba(0,122,204,0.3);
        }

        .recipe-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .recipe-number {
            background: linear-gradient(135deg, #007acc, #005c99);
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9em;
            font-family: 'Press Start 2P', monospace;
        }

        .ingredient-count {
            background: #ffc107;
            color: #000;
            padding: 4px 8px;
            border-radius: 15px;
            font-size: 0.8em;
            font-weight: bold;
            font-family: 'VT323', monospace;
        }

        .recipe-title {
            color: #fff;
            margin: 0 0 15px 0;
            font-size: 1.3em;
            font-family: 'Press Start 2P', monospace;
            line-height: 1.4;
        }

        .recipe-category {
            color: #b8b8d1;
            font-size: 0.9em;
            margin-bottom: 10px;
            padding: 6px 10px;
            background: rgba(0,122,204,0.2);
            border-radius: 6px;
            font-family: 'VT323', monospace;
            border-left: 3px solid #007acc;
            display: inline-block;
        }

        .recipe-details {
            font-family: 'Merriweather', serif;
        }

        .recipe-section {
            margin-bottom: 12px;
        }

        .recipe-section strong {
            color: #fff;
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: block;
            margin-bottom: 8px;
        }

        .ingredients-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .ingredient-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255,255,255,0.05);
            padding: 8px 12px;
            border-radius: 6px;
            border-left: 3px solid #007acc;
        }

        .ingredient-name {
            color: #d0d0e0;
            font-size: 0.9em;
            font-family: 'VT323', monospace;
        }

        .ingredient-quantity {
            color: #ffd700;
            font-weight: bold;
            font-size: 0.95em;
            font-family: 'Press Start 2P', monospace;
            padding: 2px 8px;
            background: rgba(255,215,0,0.1);
            border-radius: 4px;
        }

        .no-results {
            text-align: center;
            color: #888;
            font-size: 1.2em;
            padding: 40px;
            background: #2a2a3a;
            border-radius: 12px;
            margin: 20px;
            font-family: 'VT323', monospace;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.5em;
            }

            .subtitle {
                font-size: 1.2em;
            }

            .recipe-grid {
                grid-template-columns: 1fr;
                padding: 10px;
            }

            .search-box {
                flex-direction: column;
            }

            .search-box input,
            .search-box select {
                width: 100%;
                min-width: unset;
            }

            .recipe-title {
                font-size: 1em;
            }
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 1.2em;
            }

            .recipe-number {
                font-size: 0.7em;
            }
        }
    </style>
</body>
</html>
